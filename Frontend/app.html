<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../Frontend/css/app.css">
  <title>MedTime - Lembretes</title>
</head>
<body>

  <div class="container">

    <h1>MedTime 💊</h1>
    <div id="alerta"></div>
    <h2>Seus Lembretes de Remédio</h2>

    <button class="sair" onclick="logout()">Sair</button>

    <hr>

    <h3>Adicionar novo lembrete</h3>

    <input type="text" id="nomeRemedio" placeholder="Nome do remédio">
    <input type="time" id="horario">

    <button onclick="adicionarLembrete()">Adicionar Lembrete</button>

    <hr>

    <h3>Lembretes de Hoje:</h3>
    <ul id="lista"></ul>

  </div>

<script src="js/app.js"></script>
<script src="js/app2.js"></script>
</body>
